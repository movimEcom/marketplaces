[project]
name = "marketplaces-mcp"
version = "0.1.0"
description = "MCP servers to connect AI agents to marketplace APIs (Mercado Libre, etc.)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
meli-mx-mcp = "marketplaces_mcp.meli.server:main"
meli-mx-authorize = "marketplaces_mcp.meli.authorize:main"
meli-mx-quality-report = "marketplaces_mcp.meli.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplaces_mcp"]
